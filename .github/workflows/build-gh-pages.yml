name: Build and publish gh-pages branch

on:
  push:
    branches: [master]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build applications
        env:
          MODULE_BASE_URL: https://lingrove.stackli.me
        run: |
          node scripts/build-channels.mjs

      - name: Save release files
        uses: actions/upload-artifact@v4
        with:
          name: lingrove-channels
          path: dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Publish selected channel and deploy the complete site
        id: publish
        uses: ./.github/actions/publish-pages
        with:
          channel: ${{ github.ref_type == 'tag' && 'release' || 'snapshot' }}
          source: dist
