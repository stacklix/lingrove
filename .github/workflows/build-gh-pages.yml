name: Build and publish gh-pages branch

on:
  push:
    branches: [master]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build applications
        env:
          MODULE_BASE_URL: https://lingrove.stackli.me
        run: |
          node scripts/build-channels.mjs

      - name: Save release files
        uses: actions/upload-artifact@v4
        with:
          name: lingrove-channels
          path: dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Publish selected channel, preserving the other channel and iOS
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
          PUBLISH_CHANNEL: ${{ github.ref_type == 'tag' && 'release' || 'snapshot' }}
        run: node scripts/publish-pages-tree.mjs "$PUBLISH_CHANNEL" dist

      - name: Build and verify GitHub Pages
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.publish.outputs.commit }}
        run: bash scripts/verify-pages-build.sh
