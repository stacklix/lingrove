name: Build and publish gh-pages branch

on:
  push:
    branches: [master]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm run typecheck
          npm test
          node --test scripts/tests/build-version.test.mjs
          python3 scripts/tests/test-build-channels.py

      - name: Build applications
        env:
          MODULE_BASE_URL: https://lingrove.stackli.me
        run: |
          node scripts/build-channels.mjs

      - name: Save release files
        uses: actions/upload-artifact@v4
        with:
          name: lingrove-channels
          path: dist/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Publish web applications, preserving iOS installation files
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/publish-pages-tree.sh web dist

      - name: Build and verify GitHub Pages
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.publish.outputs.commit }}
        run: bash scripts/verify-pages-build.sh
